<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Plus1｜新しいサイトへ移りました</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
:root{--pk:#a11443;--pk2:#7d0f34;--gd:#b8924a;--gr:#e4dfd6;--gr2:#f6f3ee;--ink:#3a3236}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--gr2);color:var(--ink);font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.9;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--gr);text-align:center;padding:26px 16px 22px}
header .logo{font-family:"Cormorant Garamond",serif;font-size:34px;letter-spacing:.18em;color:var(--ink)}
header .sub{font-size:13px;letter-spacing:.2em;color:#6b6064}
main{flex:1;padding:40px 24px 48px;text-align:center}
.thanks{font-size:16px}
.line{width:56px;height:1px;background:var(--gd);margin:28px auto}
.lead{font-size:15px;letter-spacing:.12em;color:var(--gd)}
.name{font-size:34px;font-weight:700;letter-spacing:.12em;margin-top:6px}
.name small{display:block;font-size:14px;letter-spacing:.3em;color:var(--gd);font-weight:500}
.moved{font-size:17px;font-weight:700;color:var(--pk);margin-top:14px;letter-spacing:.06em}
.btn{display:block;max-width:360px;margin:30px auto 0;background:var(--pk);color:#fff;text-decoration:none;font-size:17px;font-weight:700;letter-spacing:.1em;padding:18px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(161,20,67,.25)}
.btn:active{background:var(--pk2)}
.url{font-size:13px;color:#8a7f83;margin-top:10px;word-break:break-all}
.box{margin:36px auto 0;border:1px solid var(--gd);outline:1px solid var(--gd);outline-offset:4px;padding:22px 20px;text-align:left;max-width:440px}
.box h2{font-size:16px;color:var(--pk);text-align:center;letter-spacing:.08em;margin-bottom:10px}
.box p{font-size:15.5px}
.box p+p{margin-top:8px}
footer{background:var(--gr);text-align:center;padding:18px 16px;font-family:"Cormorant Garamond",serif;letter-spacing:.28em;font-size:12px;color:#6b6064}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Plus1</div>
    <div class="sub">プラスワン</div>
  </header>
  <main>
    <p class="thanks">長いあいだPlus1をご利用いただき、<br>本当にありがとうございました。</p>
    <div class="line"></div>
    <p class="lead">12月1日より</p>
    <p class="name">尊<small>みこと</small></p>
    <p class="moved">新しいサイトへ移りました</p>
    <a class="btn" href="https://www.successf.com/mikoto/">新しいサイトはこちら</a>
    <p class="url">https://www.successf.com/mikoto/</p>
    <div class="box">
      <h2>これまでご利用のお客様へ</h2>
      <p>お引き継ぎのご案内メールをお受け取りの方は、今お使いの会員番号と暗証番号で、そのままログインいただけます。</p>
    </div>
  </main>
  <footer>MIKOTO · PLUS ONE SESSION</footer>
</div>
</body>
</html>
